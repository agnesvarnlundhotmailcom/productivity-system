name: Uppdatera dokumentation

on:
  push:
    branches:
      - docs/documentation-agent
    paths:
      - 'productivity-system/src/**'
      - 'productivity-system/.github/agenter/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-docs:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sätt upp Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Kör dokumentationsagenten
        run: |
          cd productivity-system
          node .github/agenter/generate-structure.js

      - name: Commit och push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add productivity-system/docs/overview.md
          git diff --staged --quiet || git commit -m "docs: auto-uppdatera mappstruktur [$(date +'%Y-%m-%d')]"
          git push origin HEAD:docs/documentation-agent

name: Uppdatera dokumentation

on:
  push:
    branches:
      - main
    paths:
      - 'src/**'

jobs:
  update-docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Sätt upp Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Hämta docs-branch
        run: |
          git fetch origin docs/documentation-agent
          git checkout docs/documentation-agent
          git rebase origin/main

      - name: Kör dokumentationsagenten
        run: node .github/agenter/generate-structure.js

      - name: Commit och push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/overview.md
          git diff --staged --quiet || git commit -m "docs: auto-uppdatera mappstruktur [$(date +'%Y-%m-%d')]"
          git push origin docs/documentation-agent
